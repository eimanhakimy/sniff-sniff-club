<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teddy · Sniff Sniff Club 🐾</title>
  <meta name="description" content="Meet Teddy, one of the CEOs of Sniff Sniff Club.">
  <meta name="theme-color" content="#F9E8EF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem("ssc-theme");if(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
</head>
<body class="profile" data-who="teddy" data-other="tam">

  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <a class="back" href="index.html#ceo" data-i18n="profileBack">‹ Back to home</a>

  <div class="langswitch" role="group" aria-label="Language" data-i18n-label="langLabel">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ms" aria-pressed="false">BM</button>
  </div>
  <button class="themebtn" id="theme-btn" type="button" aria-pressed="false"></button>

  <main id="main">

    <section class="section profile__hero">
      <div class="floaties" aria-hidden="true"><span>🐾</span><span>✨</span><span>💛</span><span>🐾</span><span>✨</span><span>💛</span></div>
      <p class="brand" data-i18n="profileEyebrow">Meet the CEO</p>
      <h1 id="pf-name">Teddy</h1>
      <p class="profile__title" id="pf-title"></p>
      <button class="profile__photo" id="pf-photo" type="button" aria-label="Teddy">
        <img src="assets/teddy/main.jpg" alt="Teddy" data-fallback="teddy/main.jpg" width="600" height="600" fetchpriority="high">
      </button>
      <p class="profile__hint" data-i18n="profileTap">Tap the photo for a surprise ✨</p>
      <p class="profile__tagline" id="pf-tagline"></p>
      <ul class="chips" id="pf-traits"></ul>
      <p class="profile__bio" id="pf-bio"></p>
    </section>

    <section class="section card">
      <h2 data-i18n="profileCardTitle">Official CEO Profile</h2>
      <dl class="profile__rows" id="pf-rows"></dl>
    </section>

    <section class="section card card--lavender">
      <h2 data-i18n="quoteTitle">Words of Wisdom</h2>
      <p class="profile__quote" id="pf-quote" role="status" aria-live="polite"></p>
      <button class="btn btn--primary" id="pf-quote-btn" type="button" data-i18n="quoteBtn">Another quote</button>
    </section>

    <section class="section">
      <h2 data-i18n="albumTitle">Photo Album</h2>
      <ul class="photos" id="pf-grid"></ul>
      <button class="btn btn--soft photos__more" id="pf-more" type="button" hidden></button>
    </section>

    <section class="section profile__next">
      <a class="btn btn--primary btn--big" id="pf-other" href="tam.html"></a>
      <p><a class="profile__home" href="index.html" data-i18n="profileBack">‹ Back to home</a></p>
    </section>

  </main>

  <footer class="footer">
    <p data-i18n="footer">Made by ManKim &amp; the anak-anak bulus</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" data-i18n-label="lbLabel" hidden>
    <button class="lightbox__close" id="lb-close" type="button" aria-label="Close" data-i18n-label="lbClose">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" type="button" aria-label="Previous photo" data-i18n-label="lbPrev">‹</button>
    <figure class="lightbox__fig">
      <img id="lb-img" src="" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" id="lb-next" type="button" aria-label="Next photo" data-i18n-label="lbNext">›</button>
  </div>

  <script src="js/messages.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/main.js"></script>
  <script src="js/extras.js"></script>
</body>
</html>
